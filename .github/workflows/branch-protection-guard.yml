name: "Owner Direct Push & Merge Guard"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-owner-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Actor is Repository Owner
        shell: bash
        run: |
          set -eo pipefail
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "::error::Direct push to main by '${{ github.actor }}' is forbidden. Only repository owner '${{ github.repository_owner }}' is permitted."
            exit 1
          fi
          echo "Verified: Push by repository owner '${{ github.actor }}'."

  verify-owner-approval:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Owner Authorization for PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          if [ "$PR_AUTHOR" = "$OWNER" ]; then
            echo "PR author is repository owner ($OWNER). Authorized."
            exit 0
          fi

          if [ -z "$PR_HEAD_SHA" ]; then
            PR_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          fi

          RAW_REVIEWS=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews")
          LATEST_REVIEW=$(echo "$RAW_REVIEWS" | jq -s 'add // [] | [.[] | select(.user.login == "'"$OWNER"'" and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))] | last // empty')
          if [ -z "$LATEST_REVIEW" ]; then
            echo "::error::PR requires explicit approval from repository owner ($OWNER) before merging. No qualifying review found."
            exit 1
          fi

          REVIEW_STATE=$(echo "$LATEST_REVIEW" | jq -r '.state // empty')
          REVIEW_COMMIT=$(echo "$LATEST_REVIEW" | jq -r '.commit_id // empty')

          if [ "$REVIEW_STATE" != "APPROVED" ]; then
            echo "::error::PR requires explicit approval from repository owner ($OWNER) before merging. Current owner review status: ${REVIEW_STATE:-NONE}"
            exit 1
          fi

          if [ -z "$PR_HEAD_SHA" ] || [ -z "$REVIEW_COMMIT" ] || [ "$REVIEW_COMMIT" != "$PR_HEAD_SHA" ]; then
            echo "::error::PR approval is stale. Approved commit was '${REVIEW_COMMIT:-UNKNOWN}', but current PR head is '${PR_HEAD_SHA:-UNKNOWN}'. Repository owner ($OWNER) must re-approve the latest changes."
            exit 1
          fi

          echo "PR has been reviewed and approved by repository owner ($OWNER) at commit ($REVIEW_COMMIT)."
          exit 0
